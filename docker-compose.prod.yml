services:
  # 1. Redis Service
  redis:
    image: redis:alpine
    container_name: unilish-redis-prod
    restart: always
    # Security: No public ports in prod, only internal network
    # ports:
    #   - "6379:6379" 
    networks:
      - unilish-net-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - redis_data:/data

  # 2. Server Service
  server:
    build:
      context: ./server
      target: production
    container_name: unilish-server-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      - PORT=5432
      - REDIS_URI=redis://redis:6379
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CLIENT_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:5432
      - NODE_ENV=production
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - unilish-net-prod

  # 5. Neo4j Service (Graph DB)
  neo4j:
    image: neo4j:5-community
    container_name: unilish-neo4j-prod
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - unilish-net-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Client Service
  client:
    build:
      context: ./client
      target: production
      args:
        - VITE_API_URL=http://localhost:5432/api
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: unilish-client-prod
    restart: always
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    depends_on:
      - server
    networks:
      - unilish-net-prod

  # 4. Admin Service
  admin:
    build:
      context: ./admin
      target: production
      args:
        - VITE_API_URL=http://localhost:5432
    container_name: unilish-admin-prod
    restart: always
    ports:
      - "5174:80"
    env_file:
      - ./admin/.env
    depends_on:
      - server
    networks:
      - unilish-net-prod

volumes:
  redis_data:
  neo4j_data:

networks:
  unilish-net-prod:
    driver: bridge
