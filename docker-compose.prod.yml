services:
  # 1. Redis Service (Prod)
  redis:
    image: redis/redis-stack:latest
    container_name: unilish-redis-prod
    restart: always
    # Security: No public ports in prod — internal network only
    # ports:
    #   - "6379:6379"
    networks:
      - unilish-net-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - redis_prod_data:/data

  # 2. Server Service (Express API - optimized prod build)
  server:
    build:
      context: ./server
      target: production
    container_name: unilish-server-prod
    restart: always
    ports:
      # Port 5432 shared with Cloudflare Tunnel → api-unilish.devenir.shop
      # Dev machine uses 5433, so no conflict (2 separate machines)
      - "5432:5432"
    environment:
      - PORT=5432
      - NODE_ENV=production
      - REDIS_URI=redis://redis:6379
      - SERVER_URL=https://api-unilish.devenir.shop
      - GOOGLE_CALLBACK_URL=https://api-unilish.devenir.shop/api/auth/google/callback
      - CLIENT_URL=https://unilish.devenir.shop
      - ADMIN_URL=https://admin-unilish.devenir.shop
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - unilish-net-prod

  # 3. Client Service (React SPA - served via Nginx)
  client:
    build:
      context: ./client
      target: production
      args:
        - VITE_API_URL=https://api-unilish.devenir.shop/api
    container_name: unilish-client-prod
    restart: always
    ports:
      # Port 5176 shared with Cloudflare Tunnel → unilish.devenir.shop
      # Avoids conflict with Devenir client on port 5173
      - "5176:80"
    depends_on:
      - server
    networks:
      - unilish-net-prod

  # 4. Admin Service (React SPA - served via Nginx)
  admin:
    build:
      context: ./admin
      target: production
      args:
        - VITE_API_URL=https://api-unilish.devenir.shop/api
    container_name: unilish-admin-prod
    restart: always
    ports:
      # Port 5175 shared with Cloudflare Tunnel → admin-unilish.devenir.shop
      # Avoids conflict with Devenir admin on port 5174
      - "5175:80"
    depends_on:
      - server
    networks:
      - unilish-net-prod

volumes:
  redis_prod_data:

networks:
  unilish-net-prod:
    driver: bridge
