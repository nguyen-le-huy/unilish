name: Deploy Production Unilish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment Files (From Secrets)
        env:
          SERVER_ENV_FILE: ${{ secrets.SERVER_ENV_FILE }}
          CLIENT_ENV_FILE: ${{ secrets.CLIENT_ENV_FILE }}
          ADMIN_ENV_FILE: ${{ secrets.ADMIN_ENV_FILE }}
        run: |
          set -euo pipefail

          printf '%s\n' "$SERVER_ENV_FILE" > server/.env
          printf '%s\n' "$CLIENT_ENV_FILE" > client/.env
          printf '%s\n' "$ADMIN_ENV_FILE" > admin/.env

          for env_file in server/.env client/.env admin/.env; do
            if [ ! -s "$env_file" ]; then
              echo "::error::${env_file} is empty. Please verify corresponding GitHub secret."
              exit 1
            fi
          done

          required_server_keys=(
            JWT_SECRET
            PINECONE_API_KEY
            OPENAI_API_KEY
            AZURE_SPEECH_KEY
            AZURE_SPEECH_REGION
          )

          missing_keys=()
          for key in "${required_server_keys[@]}"; do
            if ! grep -Eq "^${key}=.+$" server/.env; then
              missing_keys+=("$key")
            fi
          done

          if ! grep -Eq '^MONGO_URI=.+$|^MONGODB_URI=.+$' server/.env; then
            missing_keys+=("MONGO_URI (or MONGODB_URI)")
          fi

          if [ ${#missing_keys[@]} -gt 0 ]; then
            echo "::error::SERVER_ENV_FILE is missing required keys: ${missing_keys[*]}"
            exit 1
          fi

          echo "Env diagnostics (redacted):"
          echo "- server/.env lines: $(wc -l < server/.env)"
          echo "- client/.env lines: $(wc -l < client/.env)"
          echo "- admin/.env lines: $(wc -l < admin/.env)"
          grep -E '^(JWT_SECRET|PINECONE_API_KEY|OPENAI_API_KEY|AZURE_SPEECH_KEY|AZURE_SPEECH_REGION|MONGO_URI|MONGODB_URI)=' server/.env \
            | sed -E 's/=.*$/=[set]/'

      - name: Build and Deploy Production
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify Server Container Is Running
        run: |
          docker compose -f docker-compose.prod.yml ps
          if ! docker compose -f docker-compose.prod.yml ps --services --filter "status=running" | grep -q "^server$"; then
            echo "Server container is not running after deploy"
            docker compose -f docker-compose.prod.yml logs --tail=200 server
            exit 1
          fi

      - name: Cleanup Docker Cache
        run: |
          docker image prune -f
