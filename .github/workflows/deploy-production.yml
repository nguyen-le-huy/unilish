name: Deploy Production Unilish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment Files (From Secrets)
        run: |
          cat << 'EOF' > server/.env
          ${{ secrets.SERVER_ENV_FILE }}
          EOF
          
          cat << 'EOF' > client/.env
          ${{ secrets.CLIENT_ENV_FILE }}
          EOF
          
          cat << 'EOF' > admin/.env
          ${{ secrets.ADMIN_ENV_FILE }}
          EOF

      - name: Build and Deploy Production
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Cleanup Docker Cache
        run: |
          docker image prune -f
