services:
  # 1. Redis Service (Local Cache)
  redis:
    image: redis:alpine
    container_name: unilish-redis
    ports:
      - "6379:6379"
    networks:
      - unilish-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Server Service (Express API)
  server:
    build:
      context: ./server
      target: development
    container_name: unilish-server
    ports:
      - "5432:5432"
    volumes:
      - ./server:/app             # Sync code for hot-reload
      - /app/node_modules         # Prevent overwriting container modules
    environment:
      - PORT=5432
      - REDIS_URI=redis://redis:6379
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CLIENT_URL=http://localhost:5173
      - VITE_API_URL=http://localhost:5432
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - unilish-net

  # 5. Neo4j Service (Graph DB)
  neo4j:
    image: neo4j:5-community
    container_name: unilish-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unilish-net

  # 3. Client Service (User Frontend)
  client:
    build:
      context: ./client
      target: development
    container_name: unilish-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5432/api
    env_file:
      - ./client/.env
    networks:
      - unilish-net

  # 4. Admin Service (CMS Dashboard)
  admin:
    build:
      context: ./admin
      target: development
    container_name: unilish-admin
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5432/api
    env_file:
      - ./admin/.env
    networks:
      - unilish-net


networks:
  unilish-net:
    driver: bridge

volumes:
  neo4j_data:
