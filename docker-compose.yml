services:
  # 1. Redis Service (Dev)
  redis:
    image: redis/redis-stack:latest
    container_name: unilish-redis
    ports:
      - "6379:6379"   # Exposed locally for debugging (RedisInsight, etc.)
      - "8001:8001"   # RedisInsight UI
    networks:
      - unilish-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Server Service (Express API - dev with hot-reload)
  server:
    build:
      context: ./server
      target: development
    container_name: unilish-server
    ports:
      - "5433:5432"   # Expose dev server on host :5433
    volumes:
      - ./server:/app             # Sync code for hot-reload
      - /app/node_modules         # Prevent overwriting container modules
    environment:
      - PORT=5432
      - NODE_ENV=development
      - REDIS_URI=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - SERVER_URL=http://localhost:5433
      - GOOGLE_CALLBACK_URL=http://localhost:5433/api/auth/google/callback
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - unilish-net

  # 3. Client & Admin run NATIVELY on macOS (not in Docker)
  # Reason: Docker Desktop VirtioFS caches mtime, breaking all file watchers
  #         (both inotify and polling). Vite HMR requires mtime propagation.
  #
  # Run locally:
  #   cd client && npm run dev   → http://localhost:5173
  #   cd admin  && npm run dev   → http://localhost:5174
  #
  # client:  ← intentionally omitted
  # admin:   ← intentionally omitted

networks:
  unilish-net:
    driver: bridge

volumes: {}
